[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wow-bayesian-triage"
version = "0.1.0"
description = "Reproducible research framework for Bayesian triage of anomalous narrowband radio transients"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
verify = ["astropy>=6,<8"]

[project.scripts]
wow-legacy-report = "scripts.legacy_report:main"
wow-source-audit = "research.validation.source_audit:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["src*", "research*", "scripts*"]

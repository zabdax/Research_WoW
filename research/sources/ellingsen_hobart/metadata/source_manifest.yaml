  header_index: scripts/ellingsen_spectrum_header_index.py   # -> analysis/spectrum_header_index.csv, analysis/tarball_census.json
  exposure: scripts/ellingsen_campaign_exposure.py           # -> extracted/campaign_exposure.csv

# Provenance freeze for the donor-supplied Mt Pleasant (Hobart) follow-up
# archive covering the 1998–99 UTAS correlator era, the 2010-08-16 follow-up
# for M. Jaekle, and the 2013/2014 field campaigns.
#
# GATE STATUS: BLOCKED pending human review (MASTER DIRECTIVE §28).
# Nothing in this archive may enter the formal evidence layer without
# explicit human authorization. The five-way confirmatory comparison gate
# remains confirmatory_comparison_enabled: false.
# =============================================================================

manifest_version: "1.0"
created_utc: "2026-08-25T00:00:00Z"   # finalized at end of forensic pass; see inventory_summary.json for exact tool timestamps

donor: "Simon Ellingsen (University of Tasmania), personal communication to project owner"
acquisition_date: "2026-08-25"
acquisition_method: >-
  Google Drive multi-part download (three folder parts named
  drive-download-20260825T053211Z-1-001 / -002 / -003). The three parts were
  moved byte-intact (no renaming of any original file, no content change) into
  research/sources/ellingsen_hobart/original/ preserving their internal tree.

archive_size_bytes: 6190451083          # 6.19 GB = 5.76 GiB
file_count: 6681

campaign_identification:
  - id: 1998-99_correlator_era
    location_in_tree: ["original/drive-download-20260825T053211Z-1-001/data", "original/drive-download-20260825T053211Z-1-001/*.gsf.gz", "original/drive-download-20260825T053211Z-1-001/wow_published.pdf", "original/drive-download-20260825T053211Z-1-001/README"]
    description: >-
      High-time/spectral-resolution HI observations at Mt Pleasant during
      1998 DOY 278–282 and 1999 DOY 076–100 (w98278xx…w9910004.fit.gz),
      plus four Bob Gray SAS/GRAPH statistical plots (.gsf.gz) dated
      Sep–Oct 1998 and a published paper PDF whose metadata page range
      matches ApJ 578:967–971 (identity inferred, not yet verified).
  - id: 2010_followup
    location_in_tree: ["original/drive-download-20260825T053211Z-1-001/2010obs", "original/drive-download-20260825T053211Z-1-002/2010obs"]
    description: >-
      2010-08-16 follow-up made for Michael Jaekle: three RPFITS raw archives
      (c102280930/c102281100/c102281325.rpf), calibration FITS bruce_10228.fit,
      reduction logs, ASAP extraction script wow.py, and 6,500 calibrated ASCII
      spectrum dumps (also bundled identically in spectra.tar.gz).
  - id: "2013_2014_followup"
    location_in_tree: ["original/drive-download-20260825T053211Z-1-001/2013obs", "original/drive-download-20260825T053211Z-1-002/2013obs", "original/drive-download-20260825T053211Z-1-003/2013obs"]
    description: >-
      Test sessions (2013 July DOY 189/192/198/199) and field sessions —
      field1 at commanded J2000-labelled 19:25:28 -26:57 (DOY 218/256/258 in
      2013; DOY 283 in 2014) and field2 at 19:28:17 -26:57 (DOY 219 in 2013;
      DOY 205 in 2014) — delivered as RPFITS raw archives, observing logs,
      live-pages pointing extracts, an observing-plan .xls, wow.py variant,
      and tarballs containing 75,413 processed ASCII spectra.

directory_structure:
  original/: "donor material, byte-for-byte unchanged (three drive-download parts)"
  metadata/: "inventories, this manifest, machine-readable summaries"
  hashes/: "SHA256SUMS.txt full-content freeze"
  extracted/: "read-only derived extractions (campaign_exposure.csv)"
  analysis/: "analytical products generated by tracked scripts (header index, censuses)"
  derived/: "reserved; intentionally empty until explicitly authorized conversions"

integrity:
  sha256_manifest: hashes/SHA256SUMS.txt
  files_hashed: 6681
  unique_sha256: 6681
  exact_duplicate_files: 0     # note: spectra.tar.gz members duplicate loose 2010obs txt at member level (verified identical on samples); loose-vs-tar name sets match 6500/6500
  zero_byte_files: 0
  unreadable_files: 0
  inventory_csv: metadata/file_inventory.csv
  inventory_summary: metadata/inventory_summary.json

provenance_status: DONOR_SUPPLIED   # whole archive; per-file classes in file_inventory.csv (RAW_OBSERVATIONAL, PROCESSED_OBSERVATION, STATISTICAL_OUTPUT, SCAN_METADATA, POINTING_METADATA, DOCUMENTATION, PUBLICATION, UNKNOWN)

completeness_assessment: UNKNOWN
completeness_evidence:
  - no donor statement about whether the transfer is the complete Hobart archive is present in the received documentation
  - scan-number sequences inside tarballs are not yet audited for gaps
  - 1998–99 data/ holds 122 .fit.gz with internal sequence wYYDOYNNN; gap audit not yet performed
  - treat as PARTIAL-or-SELECTED unless the donor confirms completeness

known_limitations:
  - all mtimes are 2026 download artifacts; acquisition dating relies on embedded headers, logs, READMEs, and filename conventions
  - data/*.fit.gz contain only DATE/ORIGIN/INSTRUME cards plus 1024-lag ACF binary-table extensions; no frequency, position, time, or bandwidth cards — correlator configuration must come from external documentation
  - .rpf files are RPFITS (ATNF format); readable only via RPFITS-aware tools (ASAP scantable); no ASAP/RPFITS reader is present in this repository's environment
  - 2010 flux calibration chain is documented (README + ricky log + bruce_10228.fit); NO equivalent Jy-calibration chain is documented in-archive for the 2013/2014 dumps (wow_extract_fixtsys normalizes to a nominal Tsys=500 K)
  - field1 vs field2 RA discrepancy (19:25:28 vs 19:28:17, both labelled J2000 at Dec -26:57) is unresolved; 19:28:17 matches the precessed Wow! locale while 19:25:28 equals the un-precessed B1950 value — flagged as critical open item
  - positions/*.txt day-labeling is ambiguous (filename DOY vs SQL filter window); internal files carry time-of-day only
  - header 'Time' is the first row timestamp of each dump, not necessarily integration midpoint
  - the published PDF identity (ApJ 578:967–971 candidate) is inferred from document metadata, not yet visually verified

scientific_use_status:
  allowed_now:
    - provenance-frozen forensics
    - campaign reconstruction
    - selection-function ingredient audit
  blocked_until_human_review:
    - any promotion into mendez_evidence_vector.yaml or the formal evidence layer
    - any H5 detection-efficiency claim
    - any five-way posterior input
gate_status: "BLOCKED — awaiting human review per MASTER DIRECTIVE §28"

tools:

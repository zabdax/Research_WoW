items:
  # [2026-08-25 AMENDMENT] New donor-supplied evidence branch, forensics-only.
  # No quantity from this archive enters the evidence layer or any likelihood
  # without explicit human authorization (gate_status: BLOCKED in its manifest).
  ellingsen_hobart_followup_archive:
    question: "What did the Mt Pleasant (Hobart) 1998–99 / 2010 / 2013–14 follow-up campaigns observe, what could they have detected, and how completely can their selection function be reconstructed?"
    dependencies: ["followup_windows_completeness", "H5 follow-up likelihood (future)"]
    required_product: "Frozen donor archive; inventory + SHA-256 freeze; provenance classification; campaign reconstruction; selection-function ingredient audit; H5 readiness verdict"
    minimum_authority: "Donor-supplied primary archive (Simon Ellingsen, UTAS) with embedded headers/logs cross-checks"
    route:
      mode: donor_personal_communication
      provider: "S. Ellingsen via Google Drive transfer (3 parts)"
      endpoint: "research/sources/ellingsen_hobart/metadata/source_manifest.yaml"
      query_template: "scripts/ellingsen_inventory.py"
    validation: ["6681 files hashed uniquely", "inventory matches disk exactly (tests)", "tarball↔loose duplication verified benign", "calibration chain numerically reproduced for 2010 (ricky vs bruce FITS vs README)", "pointing epoch discrepancy flagged for donor follow-up"]
    failure_condition: "Pointing-epoch intent unresolved; thresholds/RFI/candidate rules absent; 2013/14 flux chain absent — no P(detection|…) may be built yet"
    status: acquired-frozen-forensic-audit-complete
    limitation: "Selection function partially reconstructable for 2010 only; non-detection statements forbidden; completeness of transfer UNKNOWN; .rpf not parsed (no RPFITS tooling)"
    next_action: "Human review of docs/acquisition/ELLINGSEN_DATASET_FORENSICS.md; targeted donor questions (field1/field2 epoch intent, search outcomes/thresholds, 2013/14 calibration, completeness)."

  arecibo_wow2_evidence:
    question: "What did the modern Arecibo Wow! II analysis reconstruct from the surviving Ohio SETI records, and can it be independently reproduced?"
    dependencies: ["all hypotheses' observational inputs"]
    required_product: "Frozen paper/repo artifacts; provenance-classified evidence vector; historical-vs-modern reconciliation; partial independent reproduction"
    minimum_authority: "Authoritative modern reanalysis (Méndez et al., arXiv:2508.10657 v1) + public data repository at recorded commit"
    route:
      mode: automatable_public_sources_and_git
      provider: "arXiv + planetaryhablab/Ohio-SETI + NAAPO"
      endpoint: "https://arxiv.org/abs/2508.10657 ; https://github.com/planetaryhablab/Ohio-SETI"
      query_template: "research/sources/mendez_arecibo/metadata/source_manifest.yaml"
    validation: ["source-lock hashes verified by tests", "arXiv version + ApJ checks dated 2026-08-22", "evidence vector frozen with full locators", "frequency chain reproduced (AGREE, genuine verification)", "flux arithmetic reproduced (paper-stated constants only)"]
    failure_condition: "Unfrozen sources, orphan numbers, or censored bounds encoded as point estimates"
    status: acquired-frozen-extracted-partially-reproduced
    limitation: "Flux calibration constants are paper-stated (no public derivation); empirical squint depends on the private Aug 16 1977 strip chart; no published 2-D beam map; PHL Big Ear Archive public Aug 2027; Table 4 positive-horn galactic b is a confirmed typo — use computed -18.82 deg or author-confirmed value"
    next_action: "Keep evidence vector frozen; H3 population modeling only after explicit authorization."

  h2_266p_ephemeris:
    question: "Was 266P/Christensen geometrically consistent with either Wow! candidate direction on 1977-08-15?"
    dependencies: ["H2 geometry likelihood"]
    required_product: "Observer/geocentric RA, Dec, epoch, coordinate frame, object solution identity, and uncertainty status"
    minimum_authority: "Authoritative ephemeris service with documented solution identifier"
    route:
      mode: automatable_public_api
      provider: "NASA/JPL Horizons API"
      endpoint: "https://ssd.jpl.nasa.gov/api/horizons.api"
      query_template: "configs/acquisition/horizons_266p_1977.yaml"
    validation: ["selected solution record captured", "SOE/EOE block present", "epoch and frame parsed", "raw response SHA-256 stored", "uncertainty status explicit"]
    failure_condition: "No selected authoritative solution, malformed response, or incompatible coordinate metadata"
    status: acquired-and-validated-for-geocentric-sensitivity-only
    limitation: "Geocentric response has no covariance and does not replace topocentric Big Ear geometry or physical emission likelihood."
    next_action: "Request/obtain confirmed Big Ear beam calibration and repeat with observer-specific location."
  h2_335p_ephemeris:
    question: "Was 335P/Gibbs (P/2008 Y2) geometrically consistent with either Wow! candidate direction on 1977-08-15?"
    dependencies: ["H2 geometry likelihood"]
    required_product: "Observer/geocentric RA, Dec, epoch, coordinate frame, object solution identity, and uncertainty status"
    minimum_authority: "Authoritative ephemeris service with documented solution identifier"
    route:
      mode: automatable_public_api
      provider: "NASA/JPL Horizons API"
      endpoint: "https://ssd.jpl.nasa.gov/api/horizons.api"
      query_template: "configs/acquisition/horizons_335p_1977.yaml"
    validation: ["selected solution record captured", "SOE/EOE block present", "epoch and frame parsed", "raw response SHA-256 stored", "uncertainty status explicit"]
    failure_condition: "No selected authoritative solution, malformed response, or incompatible coordinate metadata"
    status: acquired-and-validated-for-geocentric-sensitivity-only
    limitation: "Geocentric response has no covariance and does not replace topocentric Big Ear geometry or physical emission likelihood."
    next_action: "Request/obtain confirmed Big Ear beam calibration and repeat with observer-specific location."
  big_ear_beam_calibration:
    question: "What was the 1977 dual-horn beam response, orientation, and calibration?"
    dependencies: ["H1", "H2", "H3", "H4", "Big Ear geometry"]
    required_product: "Beam map/FWHM, two-horn separation/orientation, receiver configuration, calibration epoch"
    minimum_authority: "Primary technical document, observing manual, or archived engineering record"
    route:
      mode: archival_human_contact_required
      provider: "Ohio State / Big Ear / NAAPO historical archives"
      request_template: "research/data/requests/big_ear_archive_request.md"
    validation: ["document scan or archival identifier", "instrument date/configuration", "units and coordinate conventions", "beam measurement method"]
    failure_condition: "Approximate secondary value only"
    # [2026-08-23] Status advanced from 'archival/human-contact-required':
    # Arecibo Wow! II §5 now documents the empirical squint (128±3 s, replacing
    # Ehman's 154.95 s), a ~27 s positional offset, and an 8' RA beamwidth
    # assumption — but these rest on the private Aug 16 1977 strip chart and no
    # full 2-D beam map/horn response is published, so calibration remains
    # incomplete for a confirmatory observation operator.
    status: partially-addressed-by-arecibo-wow2
    next_action: "Treat Arecibo II §5 quantities as paper-stated inputs; full beam response still required before any confirmatory use."
  followup_windows_completeness:
    question: "What was each campaign's detection probability as a function of time, flux, position, linewidth and drift?"
    dependencies: ["H1", "H2", "H3", "H4", "H5", "follow-up likelihood"]
    required_product: "Timestamped windows, pointing, spectral coverage, sensitivity/completeness surface, detection pipeline"
    minimum_authority: "Primary observing logs or archive products plus campaign documentation"
    route:
      mode: mixed_public_archive_and_contact
      provider: "META, Hobart, ATA, VLA, GBT/ATA archives/authors"
      request_template: "research/data/requests/followup_data_request.md"
    validation: ["time windows", "pointing", "threshold/completeness", "frequency and drift response", "source locator"]
    failure_condition: "Pooled exposure alone"
    status: public-route-available-but-not-yet-acquired
    next_action: "Acquire primary logs/metadata before rate marginalization."
  h1_historical_rfi:
    question: "Which plausible 1977 terrestrial/instrumental mechanisms can reproduce the observation?"
    dependencies: ["H1 adversarial mixture"]
    required_product: "Receiver chain, site transmitter environment, spectrum allocation, signal diagnostic records"
    minimum_authority: "Primary engineering records and historical regulatory/operations records"
    route:
      mode: archival_human_contact_required
      provider: "Big Ear archives, historical FCC/ITU material, relevant operators"
      request_template: "research/data/requests/big_ear_archive_request.md"
    validation: ["mechanism-specific source", "1977 applicability", "frequency/time/beam predictions"]
    failure_condition: "Generic modern RFI assumptions"
    status: archival/human-contact-required
    next_action: "Collect records before assigning mixture weights."
  h3_physical_population:
    question: "Can a normalized HI flare/superradiance population reproduce flux, width, timing and rate?"
    dependencies: ["H3 evidence", "posterior prediction"]
    required_product: "Radiative/trigger model, population priors, cloud geometry, event rate and independent analogue constraints"
    minimum_authority: "Peer-reviewed theory/observations or explicitly expert-elicited priors subject to sensitivity analysis"
    route:
      mode: literature_and_domain_review
      provider: "Primary radiative-transfer and transient-population literature"
    validation: ["normalized parameter priors", "physical forward model", "rate prior", "independent evidence classification"]
    failure_condition: "Reference-flux scaling alone"
    status: public-route-available-but-not-yet-acquired
    next_action: "Complete literature extraction and expert review."
  h4_population_alignment:
    question: "What population/alignment model makes power-beam observation probabilistic rather than merely feasible?"
    dependencies: ["H4 evidence"]
    required_product: "Population, distance, EIRP, sweep, duty-cycle, alignment and revisit priors"
    minimum_authority: "Explicit scientifically defended model/prior family"
    route:
      mode: theory_and_prior_elicitation
      provider: "Technosignature/power-beaming literature and declared sensitivity priors"
    validation: ["normalized prior family", "engineering/population separation", "posterior predictive model"]
    failure_condition: "Engineering calculation treated as occurrence probability"
    status: public-route-available-but-not-yet-acquired
    next_action: "Specify prior families and sensitivity protocol."


      data_epochs: "SMP50 from 1977-02-05 (frame 001-001, voltages+LST+freq); N50CH from 1977-03-11 (frame 004-001, SNR); negatives from 1977-10-22 (frame 022-198); last data 1984-04-25 (frame 164-311)"
      snr_encoding: "1-9 numeric, A=10 .. Z=35; zero omitted; negatives struck through"
    transcription:

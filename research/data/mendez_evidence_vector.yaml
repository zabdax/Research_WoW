  flux_density:
    bound_value_jy: 256
    uncertainty_jy: 63
    unit: Jy
    kind: lower_bound_censored
    censoring_semantics:
      paper_equation: "S_Wow = SNR_Wow x sigma_channel >= 256 +/- 63 Jy (TeX l.274-276)"
      description: >
        The published constraint is a ONE-SIDED LOWER BOUND that carries a symmetric-looking
        error bar, and the paper gives no formal statistical definition of how ">=" combines
        with "+/-". Its own justification is verbal: the value "represents a lower limit
        value due not only to the uncertainty in declination but also to uncertainties in
        the noise levels" (l.279). It is a beam-centered-equivalent flux: because "the
        source was not necessarily perfectly centered in the telescope's beam, its actual
        intensity was likely greater" (l.446). Calibration-choice sensitivity is likewise
        stated explicitly: "Had the previous noise tube signal been utilized as a
        calibrator, the resulting measurement would have been approximately double" (l.279).
        The quantity therefore enters any model as CENSORED data — a one-sided bound plus
        calibration uncertainty — never as a Gaussian point estimate and never encoded as
        'flux: 256'.
      ambiguity_preserved: "per authorization Part 3 the absence of a formal statistical definition for '>=' paired with '+/-'' is DOCUMENTED, not resolved by this project"
    rounding_sensitivity_note: >
      The published bound depends on the rounding policy applied to intermediate quantities.
      Paper path as printed: sigma_cnt = 9.4/8.0 -> '1.2+/-0.3 Jy' (l.267); sigma_channel =
      1.2*sqrt(50) -> '8.5+/-2.1 Jy' (l.271); S_Wow = 30.1*8.5 = 255.85 -> '>=256+/-63 Jy'
      (Table 4 l.430). Propagating UNROUNDED intermediates instead (sigma_cnt = 1.175 Jy;
      sigma_channel = 8.31 Jy) yields >=250.1+/-56 Jy, i.e. -2.3% relative to the printed
      bound. The divergence is caused ENTIRELY by the upward rounding of sigma_cnt
      (1.175 -> 1.2) before multiplication by sqrt(50). This is a ROUNDING-POLICY
      SENSITIVITY in the published value, not a disagreement with the paper's method and
      not an error on either side; neither value is privileged by this project. See
      docs/referee_attack_map.md appendix (flux censoring) and
      research/data/processed/mendez_reproduction_results.json (flux_arithmetic).
    provenance_class: [TRANSCRIBED_ARCHIVAL, CALIBRATED, CENSORED_OR_BOUNDED]
    layer: L2
    source:
      table: "Table 4, TeX l.430"
      section: "§6 Flux Density, TeX l.205-279"
      equation: "sigma_cnt = S_ntube/SNR_ntube = 9.4/(8.0+/-1.8) = 1.2+/-0.3 Jy (l.266-268); sigma_channel = sigma_cnt*sqrt(n) = 8.5+/-2.1 Jy (l.270-272); S_Wow = SNR_Wow*sigma_channel (l.274-276)"
      figure: "fig:continuum (noise-tube SNR); fig:wowfit (SNR input)"
    calibration_constants_paper_stated:
      S_ntube_jy: 9.4
      SNR_ntube: "8.0 +/- 1.8"
      sigma_cnt_jy: "1.2 +/- 0.3"
      n_channels: 50
      sigma_channel_jy: "8.5 +/- 2.1"
      public_data_derivation: "NO — constants are paper-stated; strip-chart + noise-tube data are private (authorization Part 2)"
    minor_internal_tension: "TeX l.256 text says the noise-tube signal had 'a peak SNR of 7-sigma' while the equation uses SNR_ntube = 8.0+/-1.8 ('average SNR ... in the continuum', l.269) — recorded, not resolved"
    previous_values: "Ehman ~54 Jy; Childers ~212 Jy (TeX l.239; derivations not documented in literature)"
    conflict_1_resolution:
      rule: "Ohio-SETI v0a FLUX array ('assuming max signal was 54 Jy', README) = LEGACY_SUPERSEDED Ehman-era calibration; it is NOT the Arecibo II flux evidence and must never be substituted for it; repo FLUX preserved and labelled, not overwritten; repo SNR arrays remain valid (SNR is what N50CH recorded)"
    reproduction:
      status: AUTHORIZED_AND_COMPLETED
      mode: ARITHMETIC_REPRODUCTION_ONLY
      result_ref: research/data/processed/mendez_reproduction_results.json
    scientific_importance: "CRITICAL — H3 energetics/feasibility, H4 engineering inputs, censored-data handling project-wide"


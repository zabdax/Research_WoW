    epoch: J2000
    source: "Arecibo Wow! II (arXiv:2508.10657v1) Table 4, via frozen extraction"
    original_or_derived: original_published
    provenance_class: modern_reconstructed_coordinate   # paper's own reconstruction from printout + squint corrections
    uncertainty: "RA +/-3 s (timing; +/-0.2 s statistical, pointing dominant); Dec +/-20 arcmin (beam-limited)"
    intended_use: "project-canonical positive-horn locale; H3/H2 geometry; Hobart reconciliation reference"
    suitable_for_beam_weighting: true   # as REFERENCE POSITION ONLY

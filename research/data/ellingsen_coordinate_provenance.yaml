# =============================================================================
# ELLINGSEN/HOBART COORDINATE PROVENANCE TABLE
# Machine-readable companion to docs/acquisition/hobart_pointing_reconciliation.md
#
# Rules encoded here (and enforced by tests):
#   * no entry may silently change frame/epoch — any transformed value must be
#     a separate field with an explicit method;
#   * Hobart commanded positions are NOT approved for beam weighting until
#     GAP-HOB-002/003/004 intent questions are resolved by the human gate;
#   * suitable_for_beam_weighting refers to USE AS TARGET REFERENCE, not to
#     arithmetic validity of the stored value.
# =============================================================================

schema_version: 1.0
created_utc: "2026-08-25T00:00:00Z"
transformation_tool: "astropy 7.2.2 SkyCoord (FK4[B1950] -> ICRS includes E-terms of aberration)"

entries:

  wow_positive_horn_J2000:

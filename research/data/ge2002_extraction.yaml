D_search_procedure_and_outcome:
  detection_threshold:
    value: "Per-field single-channel threshold 5.9 sigma at P_e = 0.05 (Thompson 1991 formula); all-fields-combined 6.2 sigma; Table 3 signal thresholds 15.7-18.0 Jy (features included) / 4.74-7.71 Jy (features excluded); rms 2.66-3.0 Jy"
    evidence_class: DIRECTLY_STATED + TABLE_VALUE
    locator: "page04.txt sections 3.2-3.3 + TABLE 3"
  candidate_definition:
    value: "Spectral features above the P_e=0.05 threshold remaining after excluding known interference and removing the H i profile"
    evidence_class: DIRECTLY_STATED
    locator: "page04.txt section 3.3"
  automated_vs_manual:
    value: "Statistical threshold computation plus manual identification/inspection of features; LO-fault artifacts identified and removed by inspection"
    evidence_class: DIRECTLY_STATED
    locator: "page04.txt sections 3.2-3.3"
  rfi_rejection:
    value: "RFI environment sampled ~1 hr before/after each run (antenna overhead); off-source channels ignored; reference median-smoothing; iterative 'bridging' of RFI/H i features; final presumption: 'features are RFI in the absence of evidence otherwise'"
    evidence_class: DIRECTLY_STATED
    locator: "page03.txt sections 2.1/2.3; page04.txt section 3.3"
  hi_removal:
    value: "Running baseline (average of nine prior measurements per channel) subtracted; runs staggered over ~6 months so H i Doppler-shifts to different sky frequencies"
    evidence_class: DIRECTLY_STATED
    locator: "page04.txt section 3.1"

  candidates_reported:

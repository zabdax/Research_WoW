# =============================================================================
# PUBLIC SOURCE INVENTORY — Méndez/Arecibo Wow evidence route
# =============================================================================
# Built during Phase 0 (source mapping BEFORE bulk downloads), per MASTER
# DIRECTIVE §0.9. Every source actually used for evidence is classified and,
# where acquired, frozen under research/sources/mendez_arecibo/ with hashes in
# metadata/source_manifest.yaml. Classification scale:
#   REQUIRED  = evidence extraction cannot proceed without it
#   USEFUL    = materially supports provenance/validation
#   OPTIONAL  = context only; acquire on demand
#   REDUNDANT / IRRELEVANT = deliberately not acquired (listed for audit trail)
#
# Compiled: 2026-08-22 (UTC). Search engines were used ONLY to discover sources,
# never as evidence (§0.13).
# =============================================================================


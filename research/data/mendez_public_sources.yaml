policy_notes:
  - "Search snippets, Wikipedia, news, and AI summaries were not and will not be used as evidence (§0.13)."
  - "arXiv version + ApJ status checks recorded in research/sources/mendez_arecibo/metadata/source_manifest.yaml (checks of 2026-08-22; re-check before any Phase A freeze refresh)."
  - "HI4PI acquisition is deferred to the H3 track (Phase E) where its selection function and slice geometry can be specified scientifically."


# =============================================================================
# parameters.yaml — Module A Output
# Wow! Signal Multi-Hypothesis Bayesian Assessment
# =============================================================================
# Every field has: value, unit, uncertainty (if any), source (citation key),
# source_location (page/section/equation), status (VERIFIED / UNVERIFIED /
# UNVERIFIED-PRIMARY), and notes (caveats).
#
# STATUS KEY:
#   VERIFIED             = figure confirmed against fetched primary source text
#   UNVERIFIED-PRIMARY   = secondary confirmation exists but primary paper not
#                          accessible (e.g., paywall)
#   UNVERIFIED           = figure could not be traced to any fetched source
#   PARTIAL              = abstract-level confirmation only; full paper body
#                          needed for sub-parameters
# =============================================================================

# ---------------------------------------------------------------------------
# 1. SIGNAL PROPERTIES — The Wow! Signal itself
# ---------------------------------------------------------------------------
signal_properties:
  detection_date:
    value: "1977-08-15"
    source: "Ehman 30th Anniversary Report"
    source_location: "bigear.org/Wow30th/wow30th.htm"
    status: "VERIFIED"

  telescope:
    value: "Big Ear (Ohio State University)"
    notes: "Fixed meridian-transit instrument; two feed horns combined into single data stream"
    source: "Ehman 30th Anniversary Report"
    source_location: "bigear.org/Wow30th/wow30th.htm"
    status: "VERIFIED"

  frequency:
    value: 1420.726
    unit: "MHz"
    uncertainty: 0.005
    uncertainty_type: "symmetric"
    source: "Mendez et al. 2025"
    source_location: "arXiv:2508.10657, abstract"
    status: "VERIFIED"
    notes: "Revised value — supersedes older ~1420.4 MHz figure commonly cited pre-2025"

  peak_flux_density:
    value: ">250"
    unit: "Jy"
    uncertainty: null
    uncertainty_type: "lower_bound"
    source: "Mendez et al. 2025"
    source_location: "arXiv:2508.10657, abstract"
    status: "VERIFIED"
    notes: "Paper states 'exceeding 250 Jy' — a lower bound, not an approximation"

  peak_flux_density_pre2025:
    value: "54-212"
    unit: "Jy"
    source: "Mendez et al. 2024"
    source_location: "arXiv:2408.08513, Section VI.1, Table 1"
    status: "VERIFIED"
    notes: "Range from Ohio SETI recordings; superseded by 2025 revision but useful for validation"

  peak_snr:
    value: 30.5
    uncertainty: 0.5
    uncertainty_type: "symmetric"
    unit: "sigma"
    source: "Mendez et al. 2024"
    source_location: "arXiv:2408.08513, Section II"
    status: "VERIFIED"
    notes: "Character 'U' = 30.5 ± 0.5 times background noise"

  signal_duration:
    value: 72
    unit: "seconds"
    source: "Kipping & Gray 2022"
    source_location: "arXiv:2206.08374, abstract"
    status: "VERIFIED"
    notes: "Duration of a single beam sweep"

  two_horn_turnon_window:
    value: "~3"
    unit: "minutes"
    source: "Kipping & Gray 2022"
    source_location: "arXiv:2206.08374, abstract"
    status: "VERIFIED"
    notes: "Time difference between dual antennae; signal turned on/off within this window"

  printout_sequence:
    value: "6EQUJ5"
    source: "Ehman 30th Anniversary Report"
    source_location: "bigear.org/Wow30th/wow30th.htm"
    status: "VERIFIED"

  sky_position_candidate_1:
    ra: "19h25m02s"
    ra_uncertainty: "3s"
    dec: "-26d57m"
    dec_uncertainty: "20arcmin"
    epoch: "J2000"
    source: "Mendez et al. 2025"
    source_location: "arXiv:2508.10657, abstract"
    status: "VERIFIED"

  sky_position_candidate_2:
    ra: "19h27m55s"
    ra_uncertainty: "3s"
    dec: "-26d57m"
    dec_uncertainty: "20arcmin"
    epoch: "J2000"
    source: "Mendez et al. 2025"
    source_location: "arXiv:2508.10657, abstract"
    status: "VERIFIED"

  bandwidth:
    value: "<10"
    unit: "kHz"
    source: "Mendez et al. 2024"
    source_location: "arXiv:2408.08513, abstract"
    status: "VERIFIED"
    notes: "Also confirmed in Benford 2025 blog; actual bandwidth could be smaller"

# ---------------------------------------------------------------------------
# 2. HYPOTHESES — Parameters specific to each hypothesis
# ---------------------------------------------------------------------------
hypotheses:

  # --- H1: Instrumental / RFI ---
  H1_instrumental:
    description: "Signal was an artifact of telescope, electronics, or terrestrial interference"
    key_evidence_against:
      value: "Clean Gaussian rise/fall profile inconsistent with instrumental/software error"
      source: "Mendez et al. 2025"
      source_location: "arXiv:2508.10657, abstract"
      status: "VERIFIED"
      notes: "Exact wording should be re-checked in full PDF body for manuscript quoting"
    blc1_analog:
      description: "BLC1 provides a structured framework for evaluating instrumental/RFI hypotheses"
      verification_framework_steps: 10
      source: "Sheikh et al. 2021"
      source_location: "DOI:10.1038/s41550-021-01508-8"
      status: "VERIFIED"
      blc1_frequency:
        value: 982.002
        unit: "MHz"
        source: "Sheikh et al. 2021"
        source_location: "DOI:10.1038/s41550-021-01508-8"
        status: "VERIFIED"
      blc1_determination: "Electronically drifting intermodulation product of local terrestrial interferers"

  # --- H2: Cometary hydrogen emission ---
  H2_cometary:
    description: "Comets 266P/Christensen or P/2008 Y2 Gibbs emitted at 1420 MHz while passing through beam"
    status_assessment: "near-refuted validation control"
    positional_mismatch:
      declination_offset:
        value: "~3"
        unit: "degrees"
        source: "NAAPO Comet Hypothesis Rebuttal"
        source_location: "naapo.org/WOWCometRebuttal.html"
        status: "VERIFIED"
      ra_offset:
        value: "~47"
        unit: "minutes"
        source: "NAAPO Comet Hypothesis Rebuttal"
        source_location: "naapo.org/WOWCometRebuttal.html"
        status: "VERIFIED"
      big_ear_beam_window:
        value: "~3"
        unit: "minutes"
        source: "NAAPO Comet Hypothesis Rebuttal"
        source_location: "naapo.org/WOWCometRebuttal.html"
        status: "VERIFIED"
    paris_davies_detection:
      comet: "266P/Christensen"
      detected_frequency:
        value: 1420.25
        unit: "MHz"
        source: "Paris & Davies 2017"
        source_location: "arXiv:1706.03259, abstract and p.9"
        status: "VERIFIED"
        notes: "Close to but not identical to Wow!'s 1420.726 MHz"
      telescope: "10-meter dish, Site-B Observatory, Wesley Chapel FL"
      telescope_sensitivity_jy: null
      telescope_sensitivity_notes: "No Jy flux calibration; measurements in raw voltage (V) and dB only"
      observation_period: "2016-11-27 to 2017-02-24"
      total_observations: 200
      detected_snr:
        value: 4.76
        unit: "sigma"
        source: "Paris & Davies 2017"
        source_location: "arXiv:1706.03259, p.13"
        status: "VERIFIED"
      wow_snr_comparison:
        value: 30.76
        unit: "sigma"
        source: "Paris & Davies 2017"
        source_location: "arXiv:1706.03259, p.13"
        status: "VERIFIED"
      heliocentric_distance: null
      heliocentric_distance_notes: "NOT reported in paper"
      comet_positions:
        - date: "2017-01-20"
          ra: "19h19m44.21s"
          dec: "-25d00m23.1s"
        - date: "2017-01-26"
          ra: "19h25m54.97s"
          dec: "-24d48m54.9s"
        - date: "2017-01-28"
          ra: "19h28m01.32s"
          dec: "-24d44m51.4s"
      source_for_positions: "Paris & Davies 2017"
      positions_source_location: "arXiv:1706.03259, Tables 6-8, p.11"
      positions_status: "VERIFIED"

  # --- H3: Interstellar hydrogen cloud / stimulated maser flare ---
  H3_maser:
    description: "Cold HI cloud transiently brightened by magnetar/SGR, producing stimulated emission"
    flux_exceeding:
      value: ">250"
      unit: "Jy"
      source: "Mendez et al. 2025"
      source_location: "arXiv:2508.10657, abstract"
      status: "VERIFIED"
    frequency:
      value: 1420.726
      uncertainty: 0.005
      unit: "MHz"
      source: "Mendez et al. 2025"
      source_location: "arXiv:2508.10657, abstract"
      status: "VERIFIED"
    mini_wow_events:
      count: 4
      count_notes: "4 main signals in Teegarden's Star field; additional clouds in SGR 1935+2154 and Void fields"
      source: "Mendez et al. 2024"
      source_location: "arXiv:2408.08513, Section V"
      status: "VERIFIED"
      relative_intensity: "two orders of magnitude weaker than Wow!"
      bandwidth:
        value: "<=10"
        unit: "kHz"
        source: "Mendez et al. 2024"
        source_location: "arXiv:2408.08513, abstract"
        status: "VERIFIED"
        notes: "May be artifact of frequency resolution; actual bandwidth could be smaller or slightly larger"
      flux_density_jy:
        values: [2.077, 0.387, 0.501, 0.526]
        uncertainties: [0.242, 0.024, 0.028, 0.026]
        unit: "Jy"
        source: "Mendez et al. 2024"
        source_location: "arXiv:2408.08513, Table 5"
        status: "VERIFIED"
        notes: "Values from Table 5 for clouds A, B, C, D respectively (originally reported in mJy: 2077, 387, 501, 526). This confirms they are ~2 orders of magnitude weaker than the ~50-250 Jy Wow! signal."
      declination_all:
        value: "+16d53m00.9s"
        source: "Mendez et al. 2024"
        source_location: "arXiv:2408.08513, Section V, note to Table 5"
        status: "VERIFIED"
      observation_period: "February to May 2020"
      telescope: "Arecibo 305m"
      spectrometer: "Mock Spectrometer, L-band, full Stokes, 100ms integration, 10 kHz channels, 8192 channels/receiver"
    dsr_model:
      description: "Dicke Superradiance emission model"
      cloud_length:
        value: 2.0e11
        unit: "m"
        source: "Mendez et al. 2024"
        source_location: "arXiv:2408.08513, Section VI.4"
        status: "VERIFIED"
      cloud_diameter:
        value: 1.2e5
        unit: "m"
        source: "Mendez et al. 2024"
        source_location: "arXiv:2408.08513, Section VI.4"
        status: "VERIFIED"
      number_density:
        value: 10
        unit: "cm^-3"
        source: "Mendez et al. 2024"
        source_location: "arXiv:2408.08513, Section VI.4"
        status: "VERIFIED"
      inversion_factor:
        value: 0.01
        source: "Mendez et al. 2024"
        source_location: "arXiv:2408.08513, Section VI.4"
        status: "VERIFIED"
      T_R:
        value: "~5"
        unit: "s"
        source: "Mendez et al. 2024"
        source_location: "arXiv:2408.08513, Section VI.4"
        status: "VERIFIED"
      tau_E:
        value: 11
        unit: "minutes"
        source: "Mendez et al. 2024"
        source_location: "arXiv:2408.08513, Section VI.4"
        status: "VERIFIED"
      flux_at_0_4kpc:
        value: "~1"
        unit: "mJy"
        source: "Mendez et al. 2024"
        source_location: "arXiv:2408.08513, Section VI.4"
        status: "VERIFIED"
    source_distance_constraints:
      kinematic_max:
        value: 4.9
        uncertainty: 1.8
        unit: "kpc"
        source: "Mendez et al. 2024"
        source_location: "arXiv:2408.08513, Section VI"
        status: "VERIFIED"
      kinematic_min:
        value: 2
        unit: "kpc"
        source: "Mendez et al. 2024"
        source_location: "arXiv:2408.08513, Section VI"
        status: "VERIFIED"
      scale_height_max:
        value: "0.5-1.2"
        unit: "kpc"
        source: "Mendez et al. 2024"
        source_location: "arXiv:2408.08513, Section VI"
        status: "VERIFIED"
    kinetic_temperature_constraint:
      value: "<=2.2"
      unit: "K"
      source: "Mendez et al. 2024"
      source_location: "arXiv:2408.08513, Section VI"
      status: "VERIFIED"

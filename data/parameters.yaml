  campaigns_used:
    - name: "META"
      reference: "Horowitz et al. 1986"
    - name: "Hobart"
      reference: "Gray & Ellingsen 2002"
    - name: "ATA"
      reference: "Harp et al. 2020"
  total_followup_hours: 192

  validation_criterion: "Output within same order of magnitude as 1.78% under equivalent restricted H5-only assumptions"
  validation_gate: "Must pass BEFORE any 5-hypothesis result is produced (PRD C1.3)"
  failure_action: "Stop work and report discrepancy to humans; do NOT adjust target"


    magnetar_mechanisms:
      candidate_magnetars:
        - "SGR 1806-20"
        - "SGR 1900+14"
        - "SGR J1745-2900"
      magnetar_beam_width: "2-6 degrees (theoretical)"
      signal_delay_range: "seconds to minutes"
      source: "Mendez et al. 2024"
      source_location: "arXiv:2408.08513, Section VII"
      status: "VERIFIED"

  # --- H4: Artificial interstellar power beam (leakage) ---
  H4_power_beam:
    description: "Sidelobe leakage from an alien directed-energy beaming system"
    eirp_requirement_for_1000ly:
      value: ">1e17"
      unit: "W"
      source: "Benford, Benford & Benford 2010b"
      source_location: "arXiv:0810.3964, p.3"
      status: "VERIFIED"
      notes: "Paper states 'METI ranges > 1000 light years require an Effective Isotropic Radiated Power (EIRP) >10^17 W'"
    emitted_power_baseline:
      value: ">1"
      unit: "GW"
      source: "Benford, Benford & Benford 2010b"
      source_location: "arXiv:0810.3964, abstract"
      status: "VERIFIED"
      notes: "Illustrative baseline; abstract states 'emitted powers are >1 GW'"
    antenna_area_baseline:
      value: ">1"
      unit: "km^2"
      source: "Benford, Benford & Benford 2010b"
      source_location: "arXiv:0810.3964, abstract"
      status: "VERIFIED"
      notes: "Illustrative baseline; abstract states 'with antenna areas > km^2'"
    cost_optimization_rule:
      description: "For linear cost dependence, minimum capital cost occurs when cost is equally divided between antenna gain and radiated power"
      source: "Benford, Benford & Benford 2010b"
      source_location: "arXiv:0810.3964, abstract"
      status: "VERIFIED"
    preferred_frequency:
      value: "~10"
      unit: "GHz"
      source: "Benford, Benford & Benford 2010b"
      source_location: "arXiv:0810.3964, abstract"
      status: "VERIFIED"
      notes: "Cost optimization favors higher microwave frequencies; Wow! at 1.42 GHz is lower than this optimum"
    bandwidth_argument:
      description: "Narrow bandwidth (<10 kHz) is physics-forced by high-gain amplifier gain-bandwidth product (MOPA configuration), not a free design choice"
      source: "Benford 2025"
      source_location: "centauri-dreams.org/2025/09/22/beaming-and-bandwidth-a-new-note-on-the-wow-signal/"
      status: "VERIFIED"
    cost_optimization_equations:
      description: "Capital cost model for interstellar beacon systems"
      total_cost_formula: "C_c = k_A * A^alpha + k_S * P_t^beta"
      equal_cost_split_rule: "For linear scaling (alpha=beta=1), minimum cost when C_A = C_S = C_c/2"
      optimal_power_formula: "P_opt = sqrt(k_A * lambda^2 * EIRP / (4*pi*eta*k_S))"
      optimal_area_formula: "A_opt = sqrt(k_S * lambda^2 * EIRP / (4*pi*eta*k_A))"
      minimum_cost_formula: "C_opt = 2 * sqrt(k_A * k_S * lambda^2 * EIRP / (4*pi*eta))"
      cost_scaling_with_frequency: "C_opt proportional to 1/nu — higher frequency = cheaper"
      source: "Benford, Benford & Benford 2010b"
      source_location: "arXiv:0810.3964"
      status: "VERIFIED"
    cost_parameters_empirical:
      transmitter_cost_per_watt:
        value: "1-3"
        typical: 2
        unit: "$/W"
      antenna_cost_per_m2:
        value: "500-2000"
        typical: 1000
        unit: "$/m^2"
      scaling_exponents:
        alpha: 1.0
        beta: "0.7-1.0"
        notes: "Modular phased array architecture eliminates exponential single-dish structural costs"
      source: "Benford, Benford & Benford 2010b"
      source_location: "arXiv:0810.3964"
      status: "VERIFIED"
    worked_example_L_band:
      description: "Canonical beacon at 1.420 GHz with EIRP=10^17 W"
      eirp: 1.0e17
      frequency: 1.420  # GHz
      optimal_power:
        value: 1.88
        unit: "GW"
      optimal_antenna_area:
        value: 3.76
        unit: "km^2"
      effective_diameter:
        value: "~2.19"
        unit: "km"
      antenna_gain_dBi: 77.3
      total_capital_cost:
        value: 7.52
        unit: "billion USD"
      detection_range: "1-10 kpc (3,260-32,600 ly)"
      source: "Benford, Benford & Benford 2010b"
      source_location: "arXiv:0810.3964"
      status: "VERIFIED"
    worked_example_X_band:
      description: "Cost-optimized beacon at 10 GHz with EIRP=10^17 W"
      eirp: 1.0e17
      frequency: 10.0  # GHz
      optimal_power:
        value: 0.27
        unit: "GW"
      optimal_antenna_area:
        value: 0.54
        unit: "km^2"
      total_capital_cost:
        value: 1.07
        unit: "billion USD"
      source: "Benford, Benford & Benford 2010b"
      source_location: "arXiv:0810.3964"
      status: "VERIFIED"
    beam_dwell_time:
      description: "Duration a target remains in the sweeping searchlight beam"
      beam_width_formula: "theta_b ~ lambda / D radians"
      typical_dwell_range: "10-100 seconds"
      duty_cycle: "1e-4 to 1e-7"
      revisit_time: "days to years"
      source: "Benford, Benford & Benford 2010b"
      source_location: "arXiv:0810.3964"
      status: "VERIFIED"

  # --- H5: Stochastic repeating ETI beacon ---
  H5_stochastic_beacon:

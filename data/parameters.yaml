# ---------------------------------------------------------------------------
# 4. METHODOLOGICAL FRAMEWORK
# ---------------------------------------------------------------------------
methodological_framework:

  lingam_posterior_equation:
    equation: "P(T|D,C) = P(T|C) * xi / (1 + P(T|C) * (xi - 1))"
    equation_number: "Eq. 6"
    source: "Lingam et al. 2023"
    source_location: "ApJ 943:27, DOI:10.3847/1538-4357/acaca0, Equation 6"
    status: "VERIFIED"
    notes: "Closed-form expression; no MCMC needed for base calculation"

  xi_definition:
    equation: "xi = P(D|C,T) / P(D|C,T_bar)"
    equation_number: "Eq. 5"
    source: "Lingam et al. 2023"
    source_location: "ApJ 943:27, Equation 5"
    status: "VERIFIED"
    notes: "xi >> 1 means false positives negligible; xi << 1 means false positives dominate"

  reference_xi_values:
    em_signals:
      value: "~1e4"
      notes: "Up to xi -> infinity for optical pulses"
    no2_atmospheric:
      value: "~3"
    cfcs:
      value: "~1e4"
    physical_artifacts:
      value: "~1e4"
    source: "Lingam et al. 2023"
    source_location: "Section examples / Table"
    status: "VERIFIED"

  criterion_for_better_than_even_odds:
    condition: "P(T|C) > 1/(xi + 1)"
    approximation_for_large_xi: "P(T|C) > 1/xi, i.e. Gamma = P(T|C)*xi > 1"
    source: "Lingam et al. 2023"
    source_location: "Eq. 7 and surrounding text"
    status: "VERIFIED"

  signal_detection_theory_connections:
    positive_likelihood_ratio: "L+ = xi"
    negative_likelihood_ratio: "L- ~ 1/xi"
    diagnostic_odds_ratio: "OR ~ xi^2"
    youden_j: "J ~ (xi - 1)/(xi + 1)"
    source: "Lingam et al. 2023"
    source_location: "Section 4, Equations 9-13"
    status: "VERIFIED"

# ---------------------------------------------------------------------------
# 5. SHEIKH AXES — Nine Axes of Merit
# ---------------------------------------------------------------------------
sheikh_axes:
  axes_ordered:
    - "Observing Capability"
    - "Cost"
    - "Ancillary Benefits"
    - "Detectability"
    - "Duration"
    - "Ambiguity"
    - "Extrapolation"
    - "Inevitability"
    - "Information"
  scoring_nature: "qualitative"
  scoring_note: "Sheikh (2020) explicitly states axes 'cannot be used as a quantitative measure' in their original form. Per AGENT_BRAIN_v2 §2.3 resolved methodology: use xi for ambiguity axis; use documented custom ordinal rubric (1-5) for detectability and duration."
  ambiguity_axis_definition: "Some technosignatures might be easily mistaken for natural phenomena; narrowband radio emissions have no natural source and are thus unambiguous"
  detectability_axis_definition: "A useful technosignature produces a strong signal relative to background noise"
  duration_axis_definition: "Length of time that a technosignature would be detectable; duty cycle also contributes"
  source: "Sheikh 2020"
  source_location: "arXiv:1908.02683, full HTML text, Sections II.4-II.6"
  status: "VERIFIED"

# ---------------------------------------------------------------------------
# 6. VALIDATION BENCHMARK — Kipping & Gray reproduction target
# ---------------------------------------------------------------------------
validation_benchmark:
  source_paper: "Kipping & Gray 2022"
  source_location: "arXiv:2206.08374"
  status: "VERIFIED"

  initial_map_likelihood:
